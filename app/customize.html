<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Store - Customize</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content {
            direction: ltr;
        }

        .customize-container {
            padding: 30px;
        }

        .warning-banner {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(255, 107, 107, 0.05));
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 30px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            backdrop-filter: blur(10px);
        }

        .warning-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .warning-icon svg {
            color: #ff6b6b;
        }

        .warning-content h3 {
            color: #ff6b6b;
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .warning-content p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .customizations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .customization-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.9));
            border: 1px solid rgba(71, 85, 105, 0.2);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .customization-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .customization-card.installed {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .customization-card.installed::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg {
            color: #818cf8;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin: 0;
        }

        .card-status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(71, 85, 105, 0.3);
            color: rgba(255, 255, 255, 0.6);
        }

        .card-status.installed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .card-description {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 48px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            height: 42px;
            border-radius: 12px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-install {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
        }

        .btn-install:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-reinstall {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .btn-reinstall:hover {
            background: rgba(34, 197, 94, 0.25);
        }

        .btn-delete {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .btn-delete:hover {
            background: rgba(255, 107, 107, 0.25);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->
    <div class="top-bar drag-region">
        <button class="win-btn no-drag" onclick="window.api.minimize()">—</button>
        <button class="win-btn no-drag" onclick="window.api.fullscreen()">□</button>
        <button class="win-btn close no-drag" onclick="window.api.close()">×</button>
    </div>

    <div class="app-shell no-drag">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <div class="sidebar-logo-badge">CA</div>
                <div class="sidebar-logo-text">
                    <span>CA STORE</span>
                    <span>Graphics Manager</span>
                </div>
            </div>

            <div class="side-title">Store</div>

            <div class="side-btn" onclick="window.api.openPage('index.html')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M3 10.5L9 3l6 7.5v6H3z"></path>
                </svg>
                <span class="text">Overview</span>
            </div>

            <div class="side-btn" onclick="window.api.openPage('versions.html')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
                    <rect x="3" y="3" width="5" height="5"></rect>
                    <rect x="10" y="3" width="5" height="5"></rect>
                    <rect x="3" y="10" width="5" height="5"></rect>
                    <rect x="10" y="10" width="5" height="5"></rect>
                </svg>
                <span class="text">Graphics Packs</span>
            </div>

            <div class="side-btn" onclick="window.api.openPage('addons.html')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M9 2l3 3-3 3-3-3 3-3z"></path>
                    <path d="M9 10l3 3-3 3-3-3 3-3z"></path>
                </svg>
                <span class="text">Mods</span>
            </div>

            <div class="side-btn" onclick="window.api.openPage('downloads.html')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M9 2v9"></path>
                    <path d="M5 8l4 4 4-4"></path>
                    <path d="M4 15h10"></path>
                </svg>
                <span class="text">Downloads</span>
            </div>

            <div class="side-btn active" onclick="window.api.openPage('customize.html')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
                <span class="text">Customize</span>
            </div>

            <div class="side-title">System</div>

            <div class="side-btn" onclick="window.api.openPage('performance.html')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                </svg>
                <span class="text">Performance</span>
            </div>

            <div class="side-btn" onclick="window.api.openPage('settings.html')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="9" r="3"></circle>
                    <path d="M15 10a1.5 1.5 0 0 0 .3 1.65l.05.05a1.8 1.8 0 1 1-2.55 2.55l-.05-.05A1.5 1.5 0 0 0 11 15.5V16a1.8 1.8 0 1 1-3.6 0v-.5A1.5 1.5 0 0 0 5.25 14.2l-.05.05a1.8 1.8 0 1 1-2.55-2.55l.05-.05A1.5 1.5 0 0 0 3 10V9.5A1.5 1.5 0 0 0 2.7 7.85l-.05-.05A1.8 1.8 0 1 1 5.2 5.25l.05.05A1.5 1.5 0 0 0 7.4 5h.5A1.5 1.5 0 0 0 9.55 3.7l.05-.05A1.8 1.8 0 1 1 12.15 6.2l-.05.05A1.5 1.5 0 0 0 11 7.5V9z"></path>
                </svg>
                <span class="text">Settings</span>
            </div>

            <div class="side-btn" onclick="logout()" style="margin-top:auto; color:#ff4d6a;">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span class="text">Logout</span>
            </div>

        </aside>

        <!-- MAIN -->
        <main class="content no-drag">

            <div class="content-inner">

                <div class="customize-container">

                    <!-- Warning Banner -->
                    <div class="warning-banner">
                        <div class="warning-icon">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                        </div>
                        <div class="warning-content">
                            <h3>تنبيه هام</h3>
                            <p>يرجى مراجعة قوانين سيرفرات FiveM قبل تثبيت أي تعديل. بعض السيرفرات قد تحظر استخدام هذه التعديلات. أنت مسؤول عن التأكد من أن السيرفر يسمح بهذه التعديلات قبل استخدامها.</p>
                        </div>
                    </div>

                    <!-- Customizations Grid -->
                    <div class="customizations-grid" id="customizationsGrid">
                        <!-- Cards will be generated by JavaScript -->
                    </div>

                </div>

            </div>

        </main>

    </div>

    <div id="notify" class="notification"></div>

    <script src="customize.js"></script>

</body>

</html>
