<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ca Store - المودات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
</head>
<body data-page="addons">
    <div class="bg"></div>

    <main class="content">
        <div class="content-inner">

            <header class="page-head">
                <div>
                    <div class="eyebrow">مركز المودات</div>
                    <h1 class="page-title">مكتبة المودات</h1>
                    <p class="page-sub">إضافات وتعديلات بيئة رسمية من CA Store</p>
                </div>
                <div class="page-actions">
                    <button id="manageModsBtn" class="btn" data-ic="sliders">إدارة المودات</button>
                </div>
            </header>

            <section class="stat-grid cols-3">
                <div class="stat">
                    <div class="stat-top"><div class="icon-tile sm ok" data-ic="check"></div></div>
                    <div class="stat-value" id="modsCount">0</div>
                    <div class="stat-label">مودات مثبّتة</div>
                </div>
                <div class="stat">
                    <div class="stat-top"><div class="icon-tile sm" data-ic="package"></div></div>
                    <div class="stat-value" id="totalMods">0</div>
                    <div class="stat-label">مودات متاحة</div>
                </div>
                <div class="stat">
                    <div class="stat-top"><div class="icon-tile sm" data-ic="layers"></div></div>
                    <div class="stat-value" id="sectionsCount">0</div>
                    <div class="stat-label">تصنيفات</div>
                </div>
            </section>

            <div class="tool-bar">
                <div class="search">
                    <span data-ic="search"></span>
                    <input type="text" id="modsSearch" placeholder="ابحث عن مود..." autocomplete="off">
                    <button id="clearSearch" class="search-clear hidden-btn" data-ic="x" title="مسح"></button>
                </div>
                <select class="select" id="sortSel" title="الترتيب">
                    <option value="default">الترتيب: الافتراضي</option>
                    <option value="name">الاسم</option>
                    <option value="installed">المثبّتة أولاً</option>
                    <option value="notinstalled">غير المثبّتة أولاً</option>
                    <option value="updates">التحديثات أولاً</option>
                </select>
                <button class="tool-chip" id="favOnly" data-ic="heart">المفضلة</button>
                <button class="tool-chip" id="selectMode" data-ic="check">تحديد متعدد</button>
                <div class="end">
                    <div class="seg" id="densitySeg"><button data-density="cozy" class="on">مريح</button><button data-density="compact">مضغوط</button></div>
                    <div class="seg" id="viewSeg"><button data-view="grid" class="on" data-ic="grid">شبكة</button><button data-view="list" data-ic="list">قائمة</button></div>
                </div>
            </div>
            <div class="tabs" id="mdTabs"></div>

            <div id="mdSkeleton" class="mods-grid">
                <div class="mc shimmer-box"></div><div class="mc shimmer-box"></div><div class="mc shimmer-box"></div>
            </div>

            <div id="modsPreview"></div>

            <div id="mdEmpty" class="empty hidden">
                <div class="icon-tile" data-ic="search"></div>
                <h3>لا توجد نتائج</h3>
                <p>جرّب كلمة بحث أخرى.</p>
            </div>
        </div>
    </main>

    <div id="managePopup" class="popup hidden">
        <div class="modal wide">
            <div class="modal-head">
                <div>
                    <div class="modal-title">إدارة المودات</div>
                    <div class="modal-sub"><b id="manageCount">0</b> مود في القائمة · <span id="manageSaveStatus">لا توجد تغييرات</span></div>
                </div>
                <button id="closeManageBtn" class="modal-x" data-ic="x"></button>
            </div>
            <div id="modsList" class="manage-list"></div>
            <div class="modal-actions">
                <button id="addModBtn" class="btn" data-ic="plus">إضافة ملف</button>
                <button id="deleteAllBtn" class="btn btn-danger" data-ic="trash">حذف الكل</button>
                <button id="saveModsBtn" class="btn btn-primary" data-ic="check">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <div class="queue-bar" id="queueBar">
        <b><span id="queueN">0</span> مود محدد</b>
        <button class="cta ghost" id="queueClear">إلغاء</button>
        <button class="cta" id="queueGo" data-ic="download">تثبيت المحدد</button>
    </div>

    <div id="notify" class="notification"></div>
    <script src="shell.js"></script>
    <script src="addons.js"></script>
</body>
</html>
