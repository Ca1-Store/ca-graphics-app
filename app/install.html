<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ca Store - التثبيت</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
</head>
<body data-page="install">
    <div class="bg"></div>
    <main class="content" style="display:grid;place-items:center">
        <div class="card card-pad" style="width:min(380px,90vw);text-align:center">
            <div class="icon-tile" style="margin:0 auto 14px" data-ic="download"></div>
            <h2 style="font-size:18px;margin-bottom:6px">جاري تثبيت الجرافيكس</h2>
            <p class="card-sub" style="margin-bottom:18px">الرجاء الانتظار حتى يكتمل التثبيت</p>
            <div class="progress"><div id="installBar" class="progress-fill" style="width:0%"></div></div>
        </div>
    </main>
    <div id="notify" class="notification"></div>
    <script src="shell.js"></script>
    <script src="install.js"></script>
</body>
</html>
